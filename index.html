<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mis Finanzas</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="app">

  <header class="topbar">
    <h1>Mis Finanzas</h1>
    <div class="month-nav">
      <button id="prevMonth" class="icon-btn" aria-label="Mes anterior">‹</button>
      <span id="currentMonthLabel"></span>
      <button id="nextMonth" class="icon-btn" aria-label="Mes siguiente">›</button>
    </div>
  </header>

  <section class="summary">
    <div class="summary-card income">
      <span class="label">Ingresos</span>
      <span class="value" id="totalIncome">0,00 €</span>
    </div>
    <div class="summary-card expense">
      <span class="label">Gastos</span>
      <span class="value" id="totalExpense">0,00 €</span>
    </div>
    <div class="summary-card balance">
      <span class="label">Balance</span>
      <span class="value" id="totalBalance">0,00 €</span>
    </div>
  </section>

  <section class="form-section">
    <form id="txForm">
      <div class="tab-toggle">
        <button type="button" class="tab-btn active" data-type="expense">Gasto</button>
        <button type="button" class="tab-btn" data-type="income">Ingreso</button>
      </div>

      <div class="form-row">
        <input type="number" id="amount" placeholder="0.00" step="0.01" min="0.01" required>
        <span class="currency">€</span>
      </div>

      <div class="form-row">
        <input type="text" id="description" placeholder="Descripción (ej. Compra supermercado)" required>
      </div>

      <div class="form-row">
        <select id="category" required></select>
      </div>

      <div class="form-row">
        <input type="date" id="date" required>
      </div>

      <button type="submit" class="submit-btn">Añadir movimiento</button>
    </form>
  </section>

  <section class="filters">
    <select id="filterCategory">
      <option value="all">Todas las categorías</option>
    </select>
    <select id="filterType">
      <option value="all">Todos</option>
      <option value="income">Ingresos</option>
      <option value="expense">Gastos</option>
    </select>
  </section>

  <section class="tx-list-section">
    <h2>Movimientos</h2>
    <ul id="txList" class="tx-list"></ul>
    <p id="emptyState" class="empty-state">No hay movimientos este mes.</p>
  </section>

</div>

<script src="app.js"></script>
</body>
</html>
